experiment_name: advection_benchmark
equation: Advection
seeds: [123, 234, 345]

shared:
  model:
    params:
      modes: 16
      width: 64
  training:
    max_epochs: 100
    learning_rate: 0.001

experiments:
  - name: fno_default
    model:
      type: fno
      params: {}

  - name: cape_fno_embedding_sweep
    model:
      type: cape_fno
      params: {}
    sweep:
      model.params.embedding_weight: [1e-4, 1e-6, 1e-8]

  - name: late_fusion_sparsity_sweep
    model:
      type: late_fusion
      params:
        num_hidden: 2
        library_type: simple
    sweep:
      model.params.sparsity_weight: [1e-2, 1e-3, 1e-4]